# Installed by Volumio ControllerMpd (jovlinger/volumio3-backend).
# Restart after crash / OOM-kill (SIGKILL), with a rate limit so a tight
# death loop cannot peg the box. After the burst, the unit stays failed
# until an explicit start/restart (or the next Volumio-driven restartMpd).
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
Restart=on-failure
RestartSec=15
